<circle cx="810" cy="288" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="316" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="810" cy="316" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="344" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="810" cy="344" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="372" r="9" fill="#e377c2" stroke="#555"/>
<text x="770" y="376" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">17</text>
<circle cx="810" cy="372" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="400" r="9" fill="#2ca02c" stroke="#555"/>
<text x="770" y="404" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">19</text>
<circle cx="810" cy="400" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="428" r="9" fill="#1f77b4" stroke="#555"/>
<text x="770" y="432" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">21</text>
<circle cx="810" cy="428" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="456" r="9" fill="#ff7f0e" stroke="#555"/>
