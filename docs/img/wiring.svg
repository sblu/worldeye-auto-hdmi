<circle cx="810" cy="540" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="568" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="810" cy="568" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="596" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="810" cy="596" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="624" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="810" cy="624" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="652" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="810" cy="652" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="680" r="9" fill="#cfcfcf" stroke="#555"/>
<text x="756" y="684" font-size="11" text-anchor="end" fill="#444">39</text>
<circle cx="810" cy="680" r="9" fill="#cfcfcf" stroke="#555"/>
<text x="824" y="684" font-size="11" text-anchor="start" fill="#444">40</text>
<polyline points="340,150 480,150 480,84 955,84 955,456 819,456" fill="none" stroke="#d62728" stroke-width="3"/>
<text x="348" y="143" font-size="11" fill="#d62728">to Pi pin 24: CE0 (GPIO8)</text>
<polyline points="340,212 610,212 610,428 761,428" fill="none" stroke="#1f77b4" stroke-width="3"/>
<text x="348" y="205" font-size="11" fill="#1f77b4">to Pi pin 21: MISO (GPIO9)</text>
<polyline points="340,274 728,274 728,148 761,148" fill="none" stroke="#9467bd" stroke-width="3"/>
<text x="348" y="267" font-size="11" fill="#9467bd">to Pi pin 1: 3.3 V via 1 kΩ</text>
<rect x="652" y="265" width="56" height="18" fill="#fff" stroke="#9467bd" stroke-width="2.5"/>
<text x="680" y="279" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">1 kΩ</text>
<polyline points="340,336 550,336 550,484 761,484" fill="none" stroke="#111111" stroke-width="3"/>
<text x="348" y="329" font-size="11" fill="#111111">to Pi pin 25: GND</text>
<polyline points="340,398 640,398 640,400 761,400" fill="none" stroke="#2ca02c" stroke-width="3"/>
<text x="348" y="391" font-size="11" fill="#2ca02c">to Pi pin 19: MOSI (GPIO10)</text>
<polyline points="340,460 580,460 580,456 761,456" fill="none" stroke="#ff7f0e" stroke-width="3"/>
<text x="348" y="453" font-size="11" fill="#ff7f0e">to Pi pin 23: SCLK (GPIO11)</text>
<text x="352" y="527" font-size="13" fill="#777" font-style="italic">leave unconnected</text>
<polyline points="340,584 520,584 520,372 761,372" fill="none" stroke="#e377c2" stroke-width="3"/>
<text x="348" y="577" font-size="11" fill="#e377c2">to Pi pin 17: 3.3 V</text>
<text x="24" y="700" font-size="13" fill="#111">Reading needs pins 1, 2, 4, 5, 6, 8 only. Writing also needs pin 3 pulled to 3.3 V through the resistor: the board holds /WP low</text>
<text x="24" y="718" font-size="13" fill="#111">with about 10 kΩ, and the chip refuses to unlock until it is high. Never connect anything here to a 5 V pin (Pi pins 2 and 4).</text>
</svg>