<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="980" height="740" font-family="Helvetica,Arial,sans-serif">
<rect width="980" height="740" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111">W25Q32 flash (in the SOIC-8 clip) to Raspberry Pi 40-pin header</text>
<text x="24" y="56" font-size="13" fill="#444">Globe unplugged. The Pi powers the chip through the clip. Pin 3 link is needed for writing only.</text>
<rect x="40" y="130" width="120" height="150" rx="6" fill="#2b2b2b"/>
<circle cx="56" cy="146" r="6" fill="#bbbbbb"/>
<text x="100.0" y="205.0" font-size="13" fill="#fff" text-anchor="middle">W25Q32</text>
<text x="100.0" y="221.0" font-size="11" fill="#ccc" text-anchor="middle">top view</text>
<rect x="24" y="148" width="16" height="12" fill="#999"/><text x="18" y="158" font-size="12" text-anchor="end" fill="#111">1</text>
<rect x="160" y="148" width="16" height="12" fill="#999"/><text x="182" y="158" font-size="12" fill="#111">8</text>
<rect x="24" y="182" width="16" height="12" fill="#999"/><text x="18" y="192" font-size="12" text-anchor="end" fill="#111">2</text>
<rect x="160" y="182" width="16" height="12" fill="#999"/><text x="182" y="192" font-size="12" fill="#111">7</text>
<rect x="24" y="216" width="16" height="12" fill="#999"/><text x="18" y="226" font-size="12" text-anchor="end" fill="#111">3</text>
<rect x="160" y="216" width="16" height="12" fill="#999"/><text x="182" y="226" font-size="12" fill="#111">6</text>
<rect x="24" y="250" width="16" height="12" fill="#999"/><text x="18" y="260" font-size="12" text-anchor="end" fill="#111">4</text>
<rect x="160" y="250" width="16" height="12" fill="#999"/><text x="182" y="260" font-size="12" fill="#111">5</text>
<text x="100.0" y="300" font-size="12" fill="#444" text-anchor="middle">dot = pin 1</text>
<text x="100.0" y="316" font-size="12" fill="#444" text-anchor="middle">(clip red wire)</text>
<text x="230" y="120" font-size="13" font-weight="bold" fill="#111">Chip pin (clip adapter)</text>
<rect x="230" y="134" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="155" font-size="14" fill="#111"><tspan font-weight="bold">1</tspan>  /CS</text>
<rect x="230" y="196" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="217" font-size="14" fill="#111"><tspan font-weight="bold">2</tspan>  DO</text>
<rect x="230" y="258" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="279" font-size="14" fill="#111"><tspan font-weight="bold">3</tspan>  /WP</text>
<rect x="230" y="320" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="341" font-size="14" fill="#111"><tspan font-weight="bold">4</tspan>  GND</text>
<rect x="230" y="382" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="403" font-size="14" fill="#111"><tspan font-weight="bold">5</tspan>  DI</text>
<rect x="230" y="444" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="465" font-size="14" fill="#111"><tspan font-weight="bold">6</tspan>  CLK</text>
<rect x="230" y="506" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="527" font-size="14" fill="#111"><tspan font-weight="bold">7</tspan>  /HOLD</text>
<rect x="230" y="568" width="110" height="32" rx="4" fill="#f2f2f2" stroke="#888"/>
<text x="240" y="589" font-size="14" fill="#111"><tspan font-weight="bold">8</tspan>  VCC</text>
<text x="760" y="108" font-size="13" font-weight="bold" fill="#111">Raspberry Pi header</text>
<text x="760" y="123" font-size="11" fill="#444">pin 1 = corner nearest the microSD slot</text>
<rect x="752" y="130" width="76" height="568" rx="4" fill="#1b5e20" opacity="0.12" stroke="#1b5e20"/>
<circle cx="770" cy="148" r="9" fill="#9467bd" stroke="#555"/>
