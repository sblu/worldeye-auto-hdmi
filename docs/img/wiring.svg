<text x="770" y="488" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">25</text>
<circle cx="810" cy="484" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="770" cy="512" r="9" fill="#cfcfcf" stroke="#555"/>
<circle cx="810" cy="512" r="9" fill="#cfcfcf" stroke="#555"/>
